<script src="../lib/fengari-web.js"></script>

<script>
(function () {
const out = [];
let pass = 0, fail = 0;
function ok(cond, name, extra) { if (cond) { pass++; out.push('PASS ' + name + (extra ? '  [' + extra + ']' : '')); } else { fail++; out.push('FAIL ' + name + (extra ? '  [' + extra + ']' : '')); } }
function near(a, b, tol, name) { const d = Math.abs(a - b); ok(d <= tol, name, 'got ' + a + ' exp ' + b + ' |d|=' + d.toExponential(2)); }
const S = VS.signal, B = VS.board;
const ONLY = (location.hash || '').replace('#', '');
function sec(n) { const r = !ONLY || ONLY.split(',').indexOf(String(n)) >= 0; if (r) console.log('SECTION ' + n); return r; }
try {
  // ---------- 1. Chain vs RK4 ----------
  function rk4(stages, u, x, h, steps) {
    const n = stages.length, dtt = h / steps;
    const f = (xx) => { const d = new Float64Array(n); let w = u; for (let i = 0; i < n; i++) { d[i] = (w - xx[i]) / stages[i].tau; w = stages[i].type === 'HPF' ? w - xx[i] : xx[i]; } return d; };
    let X = Float64Array.from(x);
    for (let s = 0; s < steps; s++) {
      const k1 = f(X), x2 = X.map((v, i) => v + k1[i] * dtt / 2), k2 = f(x2), x3 = X.map((v, i) => v + k2[i] * dtt / 2), k3 = f(x3), x4 = X.map((v, i) => v + k3[i] * dtt), k4 = f(x4);
      X = X.map((v, i) => v + dtt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
    }
    return X;
  }
  if (sec(1)) for (const cfg of [[{ type: 'LPF', tau: 1e-3 }], [{ type: 'HPF', tau: 1e-3 }], [{ type: 'LPF', tau: 1e-4 }, { type: 'HPF', tau: 0.0159 }], [{ type: 'HPF', tau: 2e-4 }, { type: 'HPF', tau: 0.0159 }], [{ type: 'LPF', tau: 1e-3 }, { type: 'HPF', tau: 1e-3 }]]) {
    const ch = new S.Chain(cfg), x = new Float64Array(cfg.length).map((_, i) => 0.3 * i - 0.1);
    const x0 = Float64Array.from(x);
    ch.step(3.3, x, 1.7e-3);
    const r = rk4(cfg, 3.3, x0, 1.7e-3, 20000);
    let md = 0; for (let i = 0; i < x.length; i++) md = Math.max(md, Math.abs(x[i] - r[i]));
    ok(md < 2e-6, 'Chain.step vs RK4 ' + cfg.map(c => c.type + c.tau).join('+'), 'maxdiff ' + md.toExponential(2));
  }
  // ---------- 2. PWM period jump vs brute force ----------
  if (sec(2)) {
    const ch = new S.Chain([{ type: 'LPF', tau: 2e-4 }, { type: 'HPF', tau: 0.0159 }]);
    const r = S.rawPWM(0.00013, 1e-5, 3e-6, 3.3, 0);
    const bp = { t: 0.0001, raw: r, chain: ch, x: Float64Array.from([0.5, 0.2]), _pwm: null };
    const tq = 0.0001 + 0.0123456;
    const xa = new Float64Array(2); S.stateAt(bp, tq, xa);
    // brute force: 모든 엣지를 나열해 반주기 단위로 적분
    const xb = Float64Array.from(bp.x); let t = bp.t;
    const edges = [];
    for (let k = Math.floor((t - r.t0) / r.T) - 1; ; k++) {
      const e1 = r.t0 + k * r.T, e2 = e1 + r.Th;
      if (e1 > t && e1 < tq) edges.push(e1);
      if (e2 > t && e2 < tq) edges.push(e2);
      if (e1 > tq) break;
    }
    edges.sort((p, q) => p - q); edges.push(tq);
    for (const e of edges) { ch.step(S.rawRight(r, (t + e) / 2), xb, e - t); t = e; }
    near(xa[0], xb[0], 1e-9, 'PWM stateAt period-jump (LPF state)');
    near(xa[1], xb[1], 1e-9, 'PWM stateAt period-jump (AC state)');
  }
  // ---------- 3. Timeline sample on PWM+LPF ----------
  if (sec(3)) {
    const ch = new S.Chain([{ type: 'LPF', tau: 5e-5 }]);
    const tl = new S.Timeline();
    tl.push(0, S.rawConst(0), ch, new Float64Array(1));
    tl.push(1e-4, S.rawPWM(1e-4, 1e-4, 2.5e-5, 3.3, 0), ch);
    const N = 2000, dt = 1e-6, ta = 0.5e-4;
    const out1 = new Float64Array(N); tl.sample(ta, dt, N, out1);
    // brute force eval
    let md = 0;
    for (let j = 0; j < N; j += 37) {
      const t = ta + j * dt;
      const v = tl.valueAt(t);
      md = Math.max(md, Math.abs(v - out1[j]));
    }
    ok(md < 1e-9, 'Timeline.sample consistent with valueAt', md.toExponential(2));
    // analytic check: first rising at 1e-4 from 0 → at t=1e-4+2e-5: 3.3(1-e^{-0.4})
    const v = tl.valueAt(1e-4 + 2e-5);
    near(v, 3.3 * (1 - Math.exp(-0.4)), 1e-9, 'LPF charge analytic');
  }
  // ---------- 4. findCrossing ----------
  if (sec(4)) {
    const ch0 = new S.Chain([]);
    const tl = new S.Timeline();
    tl.push(0, S.rawConst(0), ch0, new Float64Array(0));
    tl.push(1e-3, S.rawPWM(1e-3, 1e-5, 2e-6, 3.3, 0), ch0);
    near(tl.findCrossing(0, 1, 1.65, true), 1e-3, 1e-15, 'cross: PWM start jump');
    near(tl.findCrossing(1e-3, 1, 1.65, true), 1e-3 + 1e-5, 1e-12, 'cross: next rising edge');
    near(tl.findCrossing(1e-3, 1, 1.65, false), 1e-3 + 2e-6, 1e-12, 'cross: falling edge');
    ok(tl.findCrossing(0, 1, 4, true) < 0, 'cross: level above signal -> none');
    // LPF step
    const ch1 = new S.Chain([{ type: 'LPF', tau: 1e-3 }]);
    const tl2 = new S.Timeline();
    tl2.push(0, S.rawConst(0), ch1, new Float64Array(1));
    tl2.push(2e-3, S.rawConst(3.3), ch1);
    near(tl2.findCrossing(0, 1, 1.0, true), 2e-3 + 1e-3 * Math.log(3.3 / 2.3), 1e-12, 'cross: LPF exponential analytic');
    // HPF jump
    const ch2 = new S.Chain([{ type: 'HPF', tau: 1e-3 }]);
    const tl3 = new S.Timeline();
    tl3.push(0, S.rawConst(0), ch2, new Float64Array(1));
    tl3.push(2e-3, S.rawConst(3.3), ch2);
    near(tl3.findCrossing(0, 1, 1.0, true), 2e-3, 1e-15, 'cross: HPF rising jump');
    near(tl3.findCrossing(2e-3, 1, 1.0, false), 2e-3 + 1e-3 * Math.log(3.3 / 1.0), 1e-12, 'cross: HPF decay falling');
    // PWM + LPF ramp (many periods): brute force fine sampling
    const ch3 = new S.Chain([{ type: 'LPF', tau: 2e-3 }]);
    const tl4 = new S.Timeline();
    tl4.push(0, S.rawConst(0), ch3, new Float64Array(1));
    tl4.push(1e-4, S.rawPWM(1e-4, 1e-5, 5e-6, 3.3, 0), ch3);
    const tc = tl4.findCrossing(0, 0.1, 1.5, true);
    // brute-force: find first time value >= 1.5 with dt 1e-8 around
    let tb = -1;
    { const N = 200000, dtt = 5e-8; const buf = new Float64Array(N); tl4.sample(1e-4, dtt, N, buf); for (let i = 1; i < N; i++) if (buf[i - 1] < 1.5 && buf[i] >= 1.5) { tb = 1e-4 + i * dtt; break; } }
    near(tc, tb, 1e-7, 'cross: PWM+LPF ramp (~' + Math.round((tc - 1e-4) / 1e-5) + ' periods)');
    // AC coupled PWM, level 0 rising -> every period
    const ch4 = new S.Chain([{ type: 'HPF', tau: 0.0159 }]);
    const tl5 = new S.Timeline();
    const r5 = S.rawPWM(0, 1e-3, 2.5e-4, 3.3, 0);
    const x5 = new Float64Array(1); ch4.equilibrium(S.rawAverage(r5), x5);
    tl5.push(0, r5, ch4, x5);
    const t5 = tl5.findCrossing(0.5005, 1, 0, true);
    near(t5, 0.501, 1e-12, 'cross: AC-coupled PWM rising through 0');
    // long skip-ahead: PWM 1MHz + LPF tau 10ms, level near final
    const ch6 = new S.Chain([{ type: 'LPF', tau: 1e-2 }]);
    const tl6 = new S.Timeline();
    tl6.push(0, S.rawConst(0), ch6, new Float64Array(1));
    tl6.push(0, S.rawPWM(0, 1e-6, 5e-7, 3.3, 0), ch6);
    const t6 = tl6.findCrossing(0, 1, 1.0, true);
    // approx: avg 1.65(1-e^{-t/τ}) = 1.0 → t ≈ τ ln(1.65/0.65)
    const tapprox = 1e-2 * Math.log(1.65 / 0.65);
    ok(Math.abs(t6 - tapprox) < 2e-6, 'cross: skip-ahead 1MHz PWM+LPF', 't6=' + t6 + ' approx=' + tapprox);
    const vAt = tl6.valueAt(t6), vBefore = tl6.valueAt(t6 - 1e-9);
    ok(vAt >= 1.0 - 1e-9 && vBefore < 1.0, 'cross: skip-ahead exact crossing value', vBefore + ' -> ' + vAt);
  }
  // ---------- 5. Peak detect ----------
  if (sec(5)) {
    const ch0 = new S.Chain([]);
    const tl = new S.Timeline();
    tl.push(0, S.rawConst(0), ch0, new Float64Array(0));
    tl.push(0.0123, S.rawConst(3.3), ch0);
    tl.push(0.0123 + 1e-7, S.rawConst(0), ch0);
    const N = 100, dt = 1e-3;
    const mn = new Float64Array(N), mx = new Float64Array(N), sm = new Float64Array(N);
    tl.samplePeak(0, dt, N, mn, mx); tl.sample(0, dt, N, sm);
    ok(mx[12] === 3.3 && mn[12] === 0, 'peak: 100ns glitch captured at 1kSa/s');
    ok(Math.max.apply(null, sm) === 0, 'sample mode misses 100ns glitch (expected)');
    const tl2 = new S.Timeline();
    tl2.push(0, S.rawPWM(0, 1e-6, 1e-7, 3.3, 0), ch0);
    tl2.samplePeak(0, 1e-3, 10, mn, mx);
    ok(mn[3] === 0 && mx[3] === 3.3, 'peak: 1MHz 10% PWM at 1kSa/s shows full envelope');
  }
  // ---------- 6. Lua runtime ----------
  if (sec(6)) {
    const board = new B.Board();
    const vfs = new VS.VFS();
    const logs = [];
    const rt = new VS.LuaRuntime(board, vfs, { print: (t, k, tt) => logs.push([k, t, tt]), write: (t) => logs.push(['raw', t]), onState: () => {} });
    rt.cpi = 0;
    const src = [
      'local n = 0',
      'for i = 1, 5 do gpio_write(GPIO1, i % 2) delay(1) n = n + 1 end',
      'print("n", n, string.format("%.6f", sim_time()))',
      'local f = assert(io.open("t.csv", "w")) for i = 1, 3 do f:write(i, ",", i * i, "\\n") end f:close()',
      'local s = 0 for line in io.lines("t.csv") do local a, b = line:match("(%d+),(%d+)") s = s + tonumber(b) end print("sum", s)',
      'local g = io.open("t.csv") local x = g:read("n") g:close() print("first", x)',
      'print("bits", 0xF0 | 0x0F, 0xFF & 0x3C, 1 << 4, 0xFF ~ 0x0F, ~0, 7 // 2, 7 % 3)',
      'local ok, err = pcall(function() gpio_write(DAC1, 1) end) print("pcall", ok, err)',
      'for k, t in every(0.002, 3) do print("every", k, string.format("%.4f", t)) end',
      'pwm_start(PWM1, 1000, 25) local f2, d2, r2 = pwm_read(PWM1) print("pwm", f2, d2, r2)',
      'dac_write_voltage(DAC1, 1.65) local c, v = dac_read(DAC1) print("dac", c, string.format("%.4f", v))',
      'local co = coroutine.wrap(function() for i = 1, 2 do coroutine.yield(i) end end) print("co", co(), co())',
      'print("clk", clk_freq(), ticks() > 0)'
    ].join('\n');
    ok(rt.start(src, 0, 'script'), 'lua: compile');
    let t = 0;
    for (let i = 0; i < 200 && rt.state === 'running'; i++) { t += 0.001; rt.run(t, performance.now() + 1000); }
    const outs = logs.filter(l => l[0] === 'out').map(l => l[1]);
    ok(rt.state === 'done', 'lua: finished', rt.state + ' ' + JSON.stringify(rt.errorInfo));
    ok(outs[0] === 'n\t5\t0.005000', 'lua: delay timing exact', outs[0]);
    ok(outs[1] === 'sum\t14', 'lua: file write + io.lines', outs[1]);
    ok(outs[2] === 'first\t1', 'lua: read("n")', outs[2]);
    ok(outs[3] === 'bits\t255\t60\t16\t240\t-1\t3\t1', 'lua: bitwise/arith', outs[3]);
    ok(/^pcall\tfalse\t.*DAC pin/.test(outs[4]), 'lua: pcall catches API error', outs[4]);
    ok(outs[5] === 'every\t1\t0.0050' && outs[7] === 'every\t3\t0.0090', 'lua: every() drift-free', outs[5] + ' | ' + outs[7]);
    ok(outs[8] === 'pwm\t1000.0\t25.0\ttrue', 'lua: pwm_read', outs[8]);
    ok(outs[9] === 'dac\t2048\t1.6504', 'lua: dac', outs[9]);
    ok(outs[10] === 'co\t1\t2', 'lua: coroutines', outs[10]);
    ok(/^clk\t10000000\.0\ttrue$/.test(outs[11]), 'lua: clk', outs[11]);
    // events on GPIO1
    const q = board.pin(1).queue.map(e => e.t.toFixed(6) + ':' + e.raw.v);
    ok(q.join(' ') === '0.000000:3.3 0.001000:0 0.002000:3.3 0.003000:0 0.004000:3.3', 'lua: GPIO events timestamps', q.join(' '));
  }
  // ---------- 7. instruction timing (CPI) ----------
  if (sec(7)) {
    const board = new B.Board();
    const rt = new VS.LuaRuntime(board, new VS.VFS(), { print: () => {}, onState: () => {} });
    rt.cpi = 10; // 1 µs / instr @10MHz
    ok(rt.start('while true do gpio_write(GPIO1, HIGH) gpio_write(GPIO1, LOW) end', 0, 'script'), 'cpi: compile');
    rt.run(0.01, performance.now() + 2000);
    const q = board.pin(1).queue;
    const per = (q[q.length - 1].t - q[1].t) / ((q.length - 2) / 2);
    ok(q.length > 100 && per > 2e-6 && per < 1e-4, 'cpi: bit-bang loop period from instruction timing', 'period ' + VS.util.fmtEng(per, 's') + ' events ' + q.length);
    // events must be monotonic & <= target
    let mono = true; for (let i = 1; i < q.length; i++) if (q[i].t < q[i - 1].t) mono = false;
    ok(mono && q[q.length - 1].t <= 0.01 + 1e-12, 'cpi: events monotonic and <= T_target', 'last ' + q[q.length - 1].t);
    // all events on clock grid
    let grid = true; for (const e of q) { const k = e.t * 1e7; if (Math.abs(k - Math.round(k)) > 1e-3) grid = false; }
    ok(grid, 'cpi: events aligned to board clock');
    rt.stop();
    // error line number
    const rt2 = new VS.LuaRuntime(board, new VS.VFS(), { print: () => {}, onState: () => {} });
    rt2.start('local a = 1\nlocal b = nil\nprint(b.x)', 0, 'script'); rt2.run(1, performance.now() + 1000);
    ok(rt2.state === 'error' && rt2.errorInfo.line === 3, 'lua: runtime error line', JSON.stringify(rt2.errorInfo && rt2.errorInfo.line));
    const rt3 = new VS.LuaRuntime(board, new VS.VFS(), { print: () => {}, onState: () => {} });
    ok(!rt3.start('local a = = 1', 0, 'script') && rt3.errorInfo.line === 1, 'lua: syntax error line');
  }
  // ---------- 8. full simulator ----------
  if (sec(8)) {
    const sim = new VS.Simulator();
    sim.setProbe(0, 3); // PWM1 → CH1
    sim.setProbe(1, 1); // GPIO1 → CH2
    sim.scope.s.tdiv = 200e-6; sim.scope.s.trig.level = 1.65; sim.scope.s.trig.mode = 'normal';
    sim.scope.s.display.noise = false;
    sim.runScript('pwm_start(PWM1, 2500, 30)\nwhile true do gpio_toggle(GPIO1) delay(0.5) end', 'script');
    for (let i = 0; i < 100; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 1000); }
    const rec = sim.scope.record;
    ok(rec && rec.kind === 'trig' && !rec.forced, 'sim: triggered record captured', rec ? ('wfm ' + sim.scope.wfmCount) : 'none');
    const W = sim.scope.mainWindow(rec);
    const m = VS.scopeMeasure(rec, 0, W.L, W.R);
    near(m.freq, 2500, 2, 'sim: measured PWM freq');
    near(m.duty, 30, 0.6, 'sim: measured PWM duty');
    near(m.vpp, 3.3, 0.05, 'sim: measured Vpp');
    // trigger point sample: value at trigger
    const iT = Math.round((rec.tRef - rec.t0) / rec.dt);
    ok(rec.ch[0].data[iT + 1] > 1.65 && rec.ch[0].data[iT - 1] < 1.65, 'sim: trigger at center of record', 'iT=' + iT + ' ' + rec.ch[0].data[iT - 1] + ' -> ' + rec.ch[0].data[iT + 1]);
    // CH2 GPIO toggles every 0.5 ms -> 1kHz square
    const m2 = VS.scopeMeasure(rec, 1, W.L, W.R);
    ok(m2.freq < 1000 && m2.freq > 990, 'sim: GPIO toggle freq (delay 0.5ms + 명령어 오버헤드)', m2.freq.toFixed(2) + ' Hz');
    // LPF on PWM1 then check Vavg ~ 0.99
    sim.setFilter(3, { type: 'LPF', R: 10000, C: 1e-6 });
    for (let i = 0; i < 100; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 1000); }
    sim.scope.s.trig.mode = 'auto';
    for (let i = 0; i < 20; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 1000); }
    const rec2 = sim.scope.record;
    const m3 = VS.scopeMeasure(rec2, 0, W.L, W.R);
    near(m3.vavg, 3.3 * 0.3, 0.05, 'sim: LPF on PWM → DC avg');
    ok(m3.vpp < 0.3, 'sim: LPF ripple small', 'vpp ' + m3.vpp.toFixed(3));
    // AC coupling on CH2 (GPIO square) -> avg ~ 0
    sim.setCoupling(1, 'AC');
    for (let i = 0; i < 150; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 1000); }
    const rec3 = sim.scope.record;
    const m4 = VS.scopeMeasure(rec3, 1, sim.scope.mainWindow(rec3).L, sim.scope.mainWindow(rec3).R);
    ok(Math.abs(m4.vavg) < 0.25 && m4.vmax > 1.4 && m4.vmin < -1.4, 'sim: AC coupling removes DC', 'avg ' + m4.vavg.toFixed(3) + ' max ' + m4.vmax.toFixed(2) + ' min ' + m4.vmin.toFixed(2));
    // average mode with noise reduces std
    out.push('INFO sim time ' + sim.simTime.toFixed(4) + ' s, bps ch0=' + sim.inputs[0].tl.length + ' ch1=' + sim.inputs[1].tl.length);
  }
  // ---------- 9. 성능 / Average / Single / MAX ----------
  if (sec(9)) {
    const ch0 = new S.Chain([]), ch1 = new S.Chain([{ type: 'LPF', tau: 1e-4 }]), ch2 = new S.Chain([{ type: 'LPF', tau: 1e-4 }, { type: 'HPF', tau: 0.0159 }]);
    const mk = (ch) => { const tl = new S.Timeline(); const r = S.rawPWM(0, 1e-5, 3e-6, 3.3, 0); const x = new Float64Array(ch.n); ch.equilibrium(S.rawAverage(r), x); tl.push(0, r, ch, x); return tl; };
    const N = 1000000, buf = new Float32Array(N), b2 = new Float32Array(N);
    for (const [nm, ch] of [['raw', ch0], ['LPF', ch1], ['LPF+AC', ch2]]) {
      const tl = mk(ch);
      let t0 = performance.now(); tl.sample(1.234, 1e-8, N, buf); const tA = performance.now() - t0;
      t0 = performance.now(); tl.sample(1.234, 1e-3, N, buf); const tB = performance.now() - t0;
      t0 = performance.now(); tl.samplePeak(1.234, 1e-6, N, buf, b2); const tC = performance.now() - t0;
      ok(tA < 400 && tB < 2500 && tC < 4000, 'perf 1M samples PWM ' + nm, 'dense ' + tA.toFixed(0) + 'ms, sparse ' + tB.toFixed(0) + 'ms, peak ' + tC.toFixed(0) + 'ms');
    }
    const sim = new VS.Simulator();
    sim.setProbe(0, 5);
    sim.scope.s.tdiv = 1e-4; sim.scope.s.ch[0].vdiv = 0.01; sim.scope.s.ch[0].pos = -165; sim.scope.s.ch[0].probe = 1;
    sim.runScript('dac_write_voltage(DAC1, 1.65)', 'script');
    const std = () => { const d = sim.scope.record.ch[0].data; let m = 0; for (const v of d) m += v; m /= d.length; let q = 0; for (const v of d) q += (v - m) * (v - m); return Math.sqrt(q / d.length); };
    for (let i = 0; i < 20; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 1000); }
    const s1 = std();
    sim.scope.s.acq.mode = 'average'; sim.scope.s.acq.avgN = 64; sim.scope.rearm();
    for (let i = 0; i < 200; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.002, performance.now() + 1000); }
    const s2 = std();
    ok(s2 < s1 / 3, 'average mode reduces noise', 'sample σ=' + VS.util.fmtEng(s1, 'V') + ' avg' + sim.scope.record.avgCount + ' σ=' + VS.util.fmtEng(s2, 'V'));
    sim.scope.s.acq.mode = 'sample'; sim.scope.single();
    const id0 = sim.scope.recId;
    for (let i = 0; i < 10; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 1000); }
    ok(sim.scope.running && sim.scope.recId === id0, 'single: DC 신호는 트리거되지 않아 대기', 'running=' + sim.scope.running);
    sim.scope.forceTrigger();
    for (let i = 0; i < 10; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 1000); }
    ok(!sim.scope.running && sim.scope.recId === id0 + 1, 'single + FORCE: 정확히 1회 획득 후 STOP', 'running=' + sim.scope.running + ' new records=' + (sim.scope.recId - id0));
    const sim2 = new VS.Simulator(); sim2.setProbe(0, 1); sim2.speed = 'max';
    sim2.runScript('while true do gpio_toggle(GPIO1) end', 'script');
    sim2._applyActions();
    let t0 = performance.now(); sim2._tick(); const dtk = performance.now() - t0;
    ok(dtk < 200, 'MAX speed tick with busy loop returns within budget', dtk.toFixed(1) + ' ms, sim t=' + VS.util.fmtEng(sim2.simTime, 's'));
    // MAX 속도 + 일반 스크립트(빠른 시작): 틱 시간/진행 속도
    const sim3 = new VS.Simulator(); sim3.setProbe(0, 1); sim3.setProbe(1, 3); sim3.speed = 'max';
    sim3.runScript(VS.EXAMPLES[0].code, 'q.lua'); sim3._applyActions();
    let worst = 0; const r0 = performance.now();
    for (let i = 0; i < 30; i++) { const a = performance.now(); sim3._tick(); worst = Math.max(worst, performance.now() - a); }
    const real = (performance.now() - r0) / 1000;
    ok(worst < 60 && sim3.simTime / real > 20, 'MAX speed: 틱 시간 제한 및 실시간 대비 가속', 'worst tick ' + worst.toFixed(1) + 'ms, ' + (sim3.simTime / real).toFixed(0) + 'x realtime, records ' + sim3.scope.wfmCount);
  }
  // ---------- 10. 예제 스크립트 실행 검증 ----------
  if (sec(10)) {
    for (const ex of VS.EXAMPLES) {
      const sim = new VS.Simulator();
      const logs = [];
      sim.on('console', (m) => logs.push(m));
      const st = ex.setup || {};
      if (st.probes) { sim.setProbe(0, st.probes[0] || null); sim.setProbe(1, st.probes[1] || null); }
      if (st.filters) for (const k of Object.keys(st.filters)) sim.setFilter(+k, st.filters[k]);
      if (st.tdiv) sim.scope.s.tdiv = st.tdiv;
      if (st.trig) Object.assign(sim.scope.s.trig, st.trig);
      if (st.acq && st.acq.mode) sim.scope.s.acq.mode = st.acq.mode;
      if (st.mode) sim.scope.setMode(st.mode);
      if (st.xy) Object.assign(sim.scope.s.xy, st.xy);
      if (st.ch) st.ch.forEach((c, i) => Object.assign(sim.scope.s.ch[i], c));
      if (st.cpi !== undefined) sim.runtime.cpi = st.cpi;
      sim.runScript(ex.code, ex.name); sim._applyActions();
      const t0 = performance.now();
      for (let i = 0; i < 150 && sim.runtime.state === 'running'; i++) { sim._applyActions(); sim._chunk(sim.simTime + 0.004, performance.now() + 500); }
      const errs = logs.filter(m => m.kind === 'err').map(m => m.text);
      const outs = logs.filter(m => m.kind === 'out').length;
      const acq = sim.scope.isXY() ? 'xy pts=' + (sim.scope.xyRecord() ? sim.scope.xyRecord().n : 0) : 'records=' + sim.scope.wfmCount;
      ok(errs.length === 0 && sim.runtime.state === 'running', 'example ' + ex.name, (errs[0] || ('state=' + sim.runtime.state + ' prints=' + outs + ' ' + acq + ' ' + (performance.now() - t0).toFixed(0) + 'ms')).slice(0, 160));
    }
  }
  // ---------- 11. XY 모드 ----------
  if (sec(11)) {
    const step = (sim, n, dt) => { for (let i = 0; i < n; i++) { sim._applyActions(); sim._chunk(sim.simTime + (dt || 0.004), performance.now() + 1000); } };
    const quant = (v, vd, pos) => (Math.max(-128, Math.min(127, Math.round((v / vd + pos) * 25))) / 25 - pos) * vd;
    // (a) 동일 시점 샘플링: GPIO1 / GPIO2 를 같은 순간(CPI=0)에 서로 반대로 전환 → XY 점은 (H,L) 또는 (L,H) 뿐
    {
      const sim = new VS.Simulator();
      sim.setProbe(0, 1); sim.setProbe(1, 2);
      const s = sim.scope.s;
      s.display.noise = false; s.ch[0].vdiv = s.ch[1].vdiv = 1; s.ch[0].pos = s.ch[1].pos = 0;
      sim.scope.setMode('xy'); s.xy.sr = 1e6; s.xy.rl = 20000;
      sim.runtime.setCPI(0);
      sim.runScript('local v = 0\nwhile true do v = 1 - v gpio_write(GPIO1, v) gpio_write(GPIO2, 1 - v) delay_us(13) end', 'script');
      step(sim, 20);
      const rec = sim.scope.xyRecord();
      let bad = 0, hl = 0, lh = 0;
      for (let i = 0; i < rec.n; i++) { const a = rec.x[i] > 1.65, b = rec.y[i] > 1.65; if (a === b) bad++; else if (a) hl++; else lh++; }
      ok(rec.n === 20000 && bad === 0 && hl > 5000 && lh > 5000, 'xy: CH1/CH2 동일 시각 샘플 쌍 (동시 반전 → 대각 점 없음)', 'n=' + rec.n + ' (H,L)=' + hl + ' (L,H)=' + lh + ' 불일치=' + bad);
      // 검증 민감도: CH2 를 반 샘플(0.5 µs) 늦게 샘플링하면 불일치가 생겨야 한다
      const ys = new Float32Array(rec.n);
      sim.inputs[1].tl.sample(rec.t0 + rec.dt * 0.5, rec.dt, rec.n, ys);
      let bad2 = 0; for (let i = 0; i < rec.n; i++) if ((rec.x[i] > 1.65) === (ys[i] > 1.65)) bad2++;
      ok(bad2 > 100, 'xy: (대조) 샘플 시각이 어긋나면 불일치 검출', 'skew 0.5µs → 불일치 ' + bad2);
      let mono = true; for (let i = 0; i + 1 < rec.n; i++) if (!(((rec.k0 + i + 1) * rec.dt) > ((rec.k0 + i) * rec.dt))) mono = false;
      near(rec.tEnd - rec.t0, (rec.n - 1) * rec.dt, 1e-12, 'xy: 궤적 = 연속된 Simulation Clock 격자 t_k = k/fs');
      ok(mono && Math.abs(rec.tEnd - sim.simTime) <= rec.dt + 1e-12, 'xy: 최신 샘플 = 현재 시뮬레이션 시각', 'tEnd ' + rec.tEnd + ' sim ' + sim.simTime);
    }
    // (b) 신호 처리 체인(필터 / 커플링 / ADC)이 Y-T 와 동일하게 적용
    {
      const sim = new VS.Simulator();
      sim.setProbe(0, 5); sim.setProbe(1, 6);
      sim.setFilter(5, { type: 'LPF', R: 1600, C: 100e-9 });       // DAC1 → LPF (fc ≈ 995 Hz)
      sim.setCoupling(1, 'AC');                                      // CH2 AC 커플링
      const s = sim.scope.s;
      s.display.noise = false; s.ch[0].vdiv = 0.5; s.ch[0].pos = -3.3; s.ch[1].vdiv = 0.5; s.ch[1].pos = 0;
      sim.scope.setMode('xy');
      sim.runScript('for n in every(1/50000) do local v = 1.65 + 1.5 * math.sin(2 * math.pi * 1000 * n / 50000) dac_write_voltage(DAC1, v) dac_write_voltage(DAC2, v) end', 'script');
      step(sim, 75);
      const rec = sim.scope.xyRecord();
      // 기대값 = 같은 시각의 Timeline 값 → ADC. 샘플 시각이 DAC 갱신 시각과 정확히 겹치면(우연속, 부동소수 ulp 차)
      // 엣지 직전/직후 값 중 하나와 일치해야 한다.
      let exact = 0, edge = 0, worst = 0;
      const dev = (i, t) => Math.max(Math.abs(rec.x[i] - quant(sim.inputs[0].tl.valueAt(t), 0.5, -3.3)), Math.abs(rec.y[i] - quant(sim.inputs[1].tl.valueAt(t), 0.5, 0)));
      for (let i = 0; i < rec.n; i += 7) {
        const t = (rec.k0 + i) * rec.dt;
        const d = dev(i, t);
        if (d < 1e-5) { exact++; continue; }
        if (Math.min(dev(i, t - 1e-12), dev(i, t + 1e-12)) < 1e-5) { edge++; continue; }
        worst = Math.max(worst, d);
      }
      const tot = Math.ceil(rec.n / 7);
      ok(exact + edge === tot, 'xy: 샘플 = 필터/커플링 적용 신호(Timeline) 의 ADC 값', exact + '/' + tot + ' 일치 + DAC 갱신 시각과 겹친 샘플 ' + edge + ' (±1 ps 내 일치), 불일치 최대 ' + worst.toFixed(4) + ' V');
      let xmn = Infinity, xmx = -Infinity, ymn = Infinity, ymx = -Infinity, ysum = 0;
      for (let i = 0; i < rec.n; i++) { xmn = Math.min(xmn, rec.x[i]); xmx = Math.max(xmx, rec.x[i]); ymn = Math.min(ymn, rec.y[i]); ymx = Math.max(ymx, rec.y[i]); ysum += rec.y[i]; }
      ok(xmx - xmn > 1.85 && xmx - xmn < 2.35, 'xy: CH1(X) 에 핀 LPF 적용 (1 kHz → 진폭 약 0.7배)', 'X Vpp ' + (xmx - xmn).toFixed(3) + ' V (원신호 3.0 V)');
      ok(Math.abs(ysum / rec.n) < 0.12 && ymx - ymn > 2.8, 'xy: CH2(Y) 에 AC 커플링 적용 (DC 제거)', 'Y avg ' + (ysum / rec.n).toFixed(3) + ' V, Vpp ' + (ymx - ymn).toFixed(3));
    }
    // (c) 위상차 / 진폭비 측정 (합성 신호)
    {
      const n = 10000, dt = 1e-6, f = 1234, x = new Float32Array(n), y = new Float32Array(n);
      for (let i = 0; i < n; i++) { const w = 2 * Math.PI * f * i * dt; x[i] = 1.2 + Math.sin(w); y[i] = -0.4 + 0.5 * Math.sin(w - Math.PI / 6); }
      const r = VS.xyPhase(x, y, n, dt, f);
      ok(Math.abs(r.phase + 30) < 0.2 && Math.abs(r.gain - 0.5) < 0.005, 'xy: 위상차/진폭비 (합성 -30°, 0.5)', 'Δφ ' + r.phase.toFixed(3) + '° gain ' + r.gain.toFixed(4) + ' (' + r.periods + ' 주기)');
    }
    // (d) 예제: 리사주 원 / RC 위상
    const runEx = (name, secs) => {
      const ex = VS.EXAMPLES.find(e => e.name === name), st = ex.setup, sim = new VS.Simulator();
      sim.setProbe(0, st.probes[0]); sim.setProbe(1, st.probes[1]);
      if (st.filters) for (const k of Object.keys(st.filters)) sim.setFilter(+k, st.filters[k]);
      sim.scope.setMode(st.mode);
      Object.assign(sim.scope.s.xy, st.xy);
      st.ch.forEach((c, i) => Object.assign(sim.scope.s.ch[i], c));
      sim.runScript(ex.code, name);
      step(sim, Math.round(secs / 0.004));
      return sim;
    };
    {
      const sim = runEx('09_xy_lissajous.lua', 0.1), rec = sim.scope.xyRecord();
      let rmin = Infinity, rmax = 0;
      for (let i = 0; i < rec.n; i++) { const r = Math.hypot(rec.x[i] - 1.65, rec.y[i] - 1.65); rmin = Math.min(rmin, r); rmax = Math.max(rmax, r); }
      const ph = VS.xyPhase(rec.x, rec.y, rec.n, rec.dt, 200);
      ok(rec.n === 5000 && rmin > 1.36 && rmax < 1.62 && Math.abs(ph.phase - 90) < 3, 'xy: 리사주 1:1 / 90° → 원 (반지름 1.5 V)', 'r ' + rmin.toFixed(3) + '~' + rmax.toFixed(3) + ' V, Δφ ' + ph.phase.toFixed(2) + '°');
    }
    {
      const sim = runEx('10_xy_rc_phase.lua', 0.1), rec = sim.scope.xyRecord();
      const W = { L: 0, R: (rec.n - 1) * rec.dt };
      const m = VS.scopeMeasure({ t0: rec.t0, dt: rec.dt, n: rec.n, tRef: rec.t0, ch: [{ data: rec.x, vdiv: 0.5 }, null] }, 0, W.L, W.R);
      const ph = VS.xyPhase(rec.x, rec.y, rec.n, rec.dt, m.freq);
      const fc = 1 / (2 * Math.PI * 1600 * 100e-9), th = -Math.atan(1000 / fc) * 180 / Math.PI, g = 1 / Math.sqrt(1 + Math.pow(1000 / fc, 2));
      ok(Math.abs(m.freq - 1000) < 5 && Math.abs(ph.phase - th) < 2.5 && Math.abs(ph.gain - g) < 0.03, 'xy: RC LPF 위상/진폭비 (이론 ' + th.toFixed(1) + '°, ' + g.toFixed(3) + ')',
        'f ' + m.freq.toFixed(1) + ' Hz, Δφ ' + ph.phase.toFixed(2) + '°, gain ' + ph.gain.toFixed(4));
    }
    // (e) Probe 미연결 / 핀 Disable / 채널 OFF → 표시·획득 중단, 회복 시 새 궤적
    {
      const sim = new VS.Simulator();
      sim.setProbe(0, 1); sim.setProbe(1, 3);
      sim.scope.setMode('xy');
      sim.runScript('pwm_start(PWM1, 5000, 30)\nwhile true do gpio_toggle(GPIO1) delay_us(70) end', 'script');
      step(sim, 5);
      const ep0 = sim.scope.xyBuf.epoch;
      ok(sim.scope.status === 'XY' && sim.scope.xyBlock().length === 0, 'xy: 두 채널 정상 → 획득', sim.scope.status);
      sim.setProbe(1, null); step(sim, 2);
      const b1 = sim.scope.xyBlock();
      ok(sim.scope.status === 'Hold' && !sim.scope.xyBuf && b1.length === 1 && b1[0].code === 'noprobe' && b1[0].ch === 1, 'xy: CH2 Probe 해제 → 표시 중단 (사유: Probe 미연결)', b1.map(b => b.text).join(', '));
      sim.setProbe(1, 3); step(sim, 2);
      ok(sim.scope.status === 'XY' && sim.scope.xyBuf && sim.scope.xyBuf.epoch > ep0, 'xy: Probe 재연결 → 새 궤적으로 재개', 'epoch ' + ep0 + ' → ' + (sim.scope.xyBuf && sim.scope.xyBuf.epoch));
      sim.setEnabled(1, false); step(sim, 2);
      const b2 = sim.scope.xyBlock();
      ok(sim.scope.status === 'Hold' && b2.length === 1 && b2[0].code === 'disabled' && b2[0].ch === 0, 'xy: CH1 핀(GPIO1) Disable → 표시 중단', b2.map(b => b.text).join(', '));
      sim.setEnabled(1, true); sim.scope.s.ch[1].on = false; step(sim, 2);
      const b3 = sim.scope.xyBlock();
      ok(sim.scope.status === 'Hold' && b3.length === 1 && b3[0].code === 'off', 'xy: CH2 채널 OFF → 표시 중단', b3.map(b => b.text).join(', '));
      sim.scope.s.ch[1].on = true; step(sim, 2);
      ok(sim.scope.status === 'XY', 'xy: 조건 회복 → 획득 재개');
      // (f) Run / Stop: Stop 은 획득만 중단 (시뮬레이션 진행), Run 재개 시 새 궤적
      const kStop = sim.scope.xyBuf.kLast, epS = sim.scope.xyBuf.epoch, tS = sim.simTime;
      sim.scope.setRunning(false); step(sim, 5);
      ok(sim.scope.xyBuf && sim.scope.xyBuf.kLast === kStop && sim.simTime > tS + 0.019, 'xy: STOP → 궤적 유지, 시뮬레이션은 진행', 'kLast 고정, sim +' + ((sim.simTime - tS) * 1e3).toFixed(1) + ' ms');
      sim.scope.setRunning(true); step(sim, 1);
      const Bn = sim.scope.xyBuf;
      ok(Bn && Bn.epoch > epS && Bn.kStart > kStop, 'xy: RUN 재개 → Stop 구간은 획득하지 않고 새 궤적');
      // (g) Single: 궤적 1개(Points) 획득 후 정지, 트리거 설정은 변경하지 않음
      const tm = sim.scope.s.trig.mode;
      sim.scope.s.xy.rl = 10000; sim.scope.single(); step(sim, 1, 0.002);
      const midRun = sim.scope.running;
      step(sim, 5, 0.002);
      const Bs = sim.scope.xyBuf;
      ok(midRun && !sim.scope.running && Bs.kLast - Bs.kStart + 1 >= 10000 && sim.scope.s.trig.mode === tm, 'xy: SINGLE → 10 kpts 획득 후 STOP', 'acquired ' + (Bs.kLast - Bs.kStart + 1));
      // (h) CSV: Timestamp, CH1 Voltage (X), CH2 Voltage (Y)
      const rec = sim.scope.xyRecord(), csv = VS.xyCSV(rec), lines = csv.trim().split('\n');
      let csvOk = lines[0] === 'Timestamp (s),CH1 Voltage X (V),CH2 Voltage Y (V)' && lines.length === rec.n + 1;
      for (let i = 1; i < lines.length && csvOk; i += 97) {
        const c = lines[i].split(',').map(Number);
        if (Math.abs(c[0] - (rec.k0 + i - 1) * rec.dt) > 1e-10 || Math.abs(c[1] - rec.x[i - 1]) > 1e-5 || Math.abs(c[2] - rec.y[i - 1]) > 1e-5) csvOk = false;
      }
      ok(csvOk, 'xy: CSV 저장 (Timestamp, CH1 X, CH2 Y)', lines.length - 1 + ' rows, 예: ' + lines[1]);
      // (i) Y-T 복귀: 트리거 획득 재개, XY 전용 설정은 유지
      sim.scope.setRunning(true);
      sim.scope.setMode('yt'); sim.scope.s.trig.mode = 'normal'; sim.scope.s.trig.source = 1; sim.scope.s.tdiv = 100e-6;
      const id0 = sim.scope.recId;
      step(sim, 10);
      const r2 = sim.scope.record;
      ok(r2 && r2.kind === 'trig' && !r2.forced && sim.scope.recId > id0, 'xy → Y-T 전환 후 트리거 획득 정상', 'records +' + (sim.scope.recId - id0));
      const yl = VS.ytCSV(r2).trim().split('\n');
      ok(yl[0] === 'Timestamp (s),CH1 Voltage (V),CH2 Voltage (V)' && yl.length === r2.n + 1, 'Y-T: CSV 저장', (yl.length - 1) + ' rows');
    }
    // (j) 성능: 1 MSa/s 연속 XY 획득 (실시간 처리 가능 여부), MAX 속도 틱 예산
    {
      const sim = new VS.Simulator();
      sim.setProbe(0, 5); sim.setProbe(1, 6); sim.setFilter(6, { type: 'LPF', R: 1600, C: 100e-9 });
      sim.scope.setMode('xy');
      sim.runScript(VS.EXAMPLES.find(e => e.name === '10_xy_rc_phase.lua').code, 'p.lua');
      step(sim, 5);
      let t0 = performance.now(); step(sim, 50); const dt1 = performance.now() - t0;
      ok(dt1 < 200, 'perf: XY 1 MSa/s × 0.2 s 시뮬레이션 (DAC 50 kHz 스크립트 포함)', dt1.toFixed(0) + ' ms 실시간 (< 200 ms)');
      sim.speed = 'max';
      let worst = 0; const s0 = sim.simTime, r0 = performance.now();
      for (let i = 0; i < 10; i++) { const a = performance.now(); sim._tick(); worst = Math.max(worst, performance.now() - a); }
      ok(worst < 120 && sim.simTime > s0, 'perf: XY + MAX 속도 틱 예산', 'worst tick ' + worst.toFixed(1) + ' ms, ' + ((sim.simTime - s0) / ((performance.now() - r0) / 1000)).toFixed(1) + 'x realtime');
    }
  }
} catch (e) { fail++; out.push('EXCEPTION ' + e + '\n' + e.stack); }
// ---------- 비동기 섹션 (네트워크: JS 이벤트 루프가 돌아야 응답이 도착함) ----------
(async () => {
  try { if (sec(12)) await netTests(); }
  catch (e) { fail++; out.push('EXCEPTION ' + e + '\n' + e.stack); }
  out.unshift('RESULT pass=' + pass + ' fail=' + fail);
  document.getElementById('out').textContent = out.join('\n');
})();

// ---------- 12. 네트워크 (HTTP / WebSocket) — 모의 fetch / WebSocket ----------
async function netTests() {
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const mock = { aborted: 0, fetches: [], sockets: [] };
  const bytes256 = () => { const b = new Uint8Array(256); for (let i = 0; i < 256; i++) b[i] = i; return b; };
  const frameText = (k) => [k * 100 + 1, 2000, k * 100 + 2, 2100, k * 100 + 3, 2200, k * 100 + 4, 2300].join(',') + '\n';
  const INFO = 'frames=6\nfps=25\nmax_points=4\nsource=mock\n';
  // 브라우저 fetch 와 같은 비동기 동작 (setTimeout 으로 응답, AbortSignal 지원)
  function mockFetch(url, init) {
    mock.fetches.push({ url: url, init: init });
    const path = url.replace(/^\w+:\/\/[^/]+/, '');
    return new Promise((resolve, reject) => {
      let settled = false;
      const res = (v) => { if (!settled) { settled = true; resolve(v); } };
      const rej = (e) => { if (!settled) { settled = true; reject(e); } };
      if (init && init.signal) init.signal.addEventListener('abort', () => { mock.aborted++; rej(new DOMException('The operation was aborted.', 'AbortError')); });
      const reply = (ms, body, status, headers) => setTimeout(() => res(new Response(body, { status: status || 200, headers: headers || {} })), ms);
      let m;
      if (path === '/bytes') reply(20, bytes256(), 200, { 'X-Test': 'yes' });
      else if (path === '/slow') reply(120, 'slow-body');
      else if (path === '/hang') { /* 응답 없음 */ }
      else if (path === '/fail') setTimeout(() => rej(new TypeError('Failed to fetch')), 5);
      else if (path === '/nf') reply(5, 'not found', 404);
      else if (path === '/echo') reply(10, init.body || '', 200, { 'X-Method': init.method, 'X-CT': (init.headers && init.headers['Content-Type']) || '' });
      else if (path === '/api/info') reply(5, INFO);
      else if ((m = /^\/api\/frame\/(\d+)$/.exec(path))) reply(8, frameText(+m[1]));
      else reply(5, 'unknown', 404);
    });
  }
  // 브라우저 WebSocket 과 같은 비동기 동작 + 간단한 서버 동작
  class MockWS {
    constructor(url) {
      this.url = url; this.readyState = 0; this.binaryType = 'blob'; this.sent = [];
      mock.sockets.push(this);
      setTimeout(() => {
        if (/refuse/.test(url)) { this.readyState = 3; if (this.onerror) this.onerror({}); if (this.onclose) this.onclose({ code: 1006, reason: '' }); return; }
        this.readyState = 1; if (this.onopen) this.onopen({});
      }, 10);
    }
    send(m) {
      if (this.readyState !== 1) throw new Error('InvalidStateError: not open');
      this.sent.push(m);
      setTimeout(() => this._server(m), 4);
    }
    _server(m) {
      if (this.readyState !== 1) return;
      if (typeof m !== 'string') { this._emit(new Uint8Array(m).slice().buffer); return; }   // binary echo
      if (m === 'bin') { this._emit(bytes256().buffer); return; }
      if (m.startsWith('burst ')) { for (let i = 0, n = +m.slice(6); i < n; i++) this._emit('m' + i); return; }
      if (m === 'bye') { this.readyState = 3; if (this.onclose) this.onclose({ code: 1000, reason: 'bye' }); return; }
      if (m === 'info') { this._emit(INFO); return; }
      if (m.startsWith('stream')) { let k = 0; this._tm = setInterval(() => { if (this.readyState === 1) this._emit(frameText(k++ % 6)); }, 40); return; }
      this._emit('echo:' + m);
    }
    _emit(d) { if (this.onmessage) this.onmessage({ data: d }); }
    close(code, reason) {
      if (this.readyState >= 2) return;
      this.readyState = 2; clearInterval(this._tm);
      setTimeout(() => { this.readyState = 3; if (this.onclose) this.onclose({ code: code || 1000, reason: reason || '' }); }, 3);
    }
  }
  const impl = { fetch: mockFetch, WebSocket: MockWS };
  /** 스크립트 실행: 틱마다 시뮬레이션 dt 진행 + 이벤트 루프 양보(응답 도착) */
  async function runLua(code, opts) {
    opts = opts || {};
    const sim = new VS.Simulator();
    sim.runtime.net.impl = impl;
    if (opts.cpi !== undefined) sim.runtime.cpi = opts.cpi;
    if (opts.setup) opts.setup(sim);
    const outs = [];
    sim.on('console', (m) => { if (m.kind === 'out') outs.push(m.text); });
    sim.runScript(code, 'net.lua'); sim._applyActions();
    for (let i = 0; i < (opts.max || 1500) && sim.runtime.state === 'running'; i++) {
      sim._applyActions();
      sim._chunk(sim.simTime + (opts.dt || 0.004), performance.now() + 200);
      if (opts.until && opts.until(sim, outs)) break;
      await sleep(1);
    }
    return { sim: sim, outs: outs, rt: sim.runtime };
  }
  const levels = (tl) => tl.bps.map(b => [b.t, b.raw.v]);
  const onEdge = (t) => Math.abs(t * 1e7 - Math.round(t * 1e7)) < 1e-3;

  // (a) 대기형 http_get: 바이너리 무손실, 대기 중 시뮬레이션 진행, 출력 유지
  {
    const r = await runLua([
      'gpio_write(GPIO1, HIGH)',
      'local t0 = sim_time()',
      'local body, st, h = http_get("http://mock/bytes")',
      'local t1 = sim_time()',
      'local ok = #body == 256',
      'for i = 0, 255 do if body:byte(i + 1) ~= i then ok = false end end',
      'print("bytes", #body, ok, st, h["x-test"])',
      'printf("waited %.4f", t1 - t0)',
      'gpio_write(GPIO1, LOW)'
    ].join('\n'), { setup: (sim) => sim.setProbe(0, 1) });
    ok(r.rt.state === 'done', 'net: http_get 스크립트 완료', r.rt.state + ' ' + JSON.stringify(r.rt.errorInfo));
    ok(r.outs[0] === 'bytes\t256\ttrue\t200\tyes', 'net: http_get 바이너리 본문 0..255 무손실 + status/headers', r.outs[0]);
    const waited = parseFloat((r.outs[1] || '').split(' ')[1]);
    ok(waited >= 0.004, 'net: 응답 대기 중에도 시뮬레이션 시계 진행 (시계 정지 없음)', r.outs[1] + ' s (sim, 실제 응답 시간에 비례)');
    // 프로브 연결 시점(t=0, 0 V) → HIGH(명령어 몇 개 뒤) → 응답 후 LOW. 그 사이 변화 없음
    const lv = levels(r.sim.inputs[0].tl).filter((x, i, a) => i === 0 || x[1] !== a[i - 1][1]);
    const tLow = lv.length ? lv[lv.length - 1][0] : NaN;
    ok(lv.length === 3 && lv[1][1] === 3.3 && lv[1][0] < 1e-5 && lv[2][1] === 0 && tLow >= waited && onEdge(tLow), 'net: 대기 중 출력 유지 (HIGH → 응답 후 LOW, 클럭 엣지에서 재개)', JSON.stringify(lv.map(x => [+x[0].toFixed(7), x[1]])));
  }
  // (b) 비동기 http_request: 대기 중 출력은 스크립트가 결정
  {
    const r = await runLua([
      'local req = http_request("http://mock/slow")',
      'print("ready0", req:ready(), req:result())',
      'local n = 0',
      'while not req:ready() do gpio_toggle(GPIO2); delay(1); n = n + 1 end',
      'local body, st = req:result()',
      'print("loop", n >= 20, body, st)',
      'print("cached", req:result())'
    ].join('\n'), { setup: (sim) => sim.setProbe(0, 2) });
    ok(r.outs[0] === 'ready0\tfalse\tnil\tpending', 'net: http_request 즉시 반환 (ready=false, result=pending)', r.outs[0]);
    ok(r.outs[1] === 'loop\ttrue\tslow-body\t200', 'net: 응답 대기 동안 스크립트가 출력 제어 (GPIO2 토글)', r.outs[1]);
    ok(/^cached\tslow-body\t200\ttable: /.test(r.outs[2] || ''), 'net: result() 재호출 시 같은 결과', r.outs[2]);
    ok(r.sim.inputs[0].tl.length >= 20, 'net: 대기 중 토글 이벤트가 파형에 기록', r.sim.inputs[0].tl.length + ' edges');
  }
  // (c) 타임아웃(시뮬레이션 시간) / 네트워크 오류 / 상태 코드 / POST 바이너리
  {
    const ab0 = mock.aborted;
    const r = await runLua([
      'local t0 = sim_time()',
      'local b, e = http_get("http://mock/hang", { timeout = 0.05 })',
      'printf("timeout %s %s %.6f", tostring(b), tostring(e), sim_time() - t0)',
      'local b2, e2 = http_get("http://mock/fail")',
      'print("fail", b2, (e2 or ""):find("network error", 1, true) ~= nil)',
      'local b3, s3 = http_get("http://mock/nf")',
      'print("404", b3, s3)',
      'local b4, s4, h4 = http_post("http://mock/echo", "a\\0\\255b", { content_type = "application/x-test" })',
      'print("post", b4 == "a\\0\\255b", #b4, h4["x-method"], h4["x-ct"])'
    ].join('\n'), { cpi: 0 });
    ok(r.outs[0] === 'timeout nil timeout 0.050000', 'net: http_get timeout = 시뮬레이션 시간 (정확히 50 ms 후 재개)', r.outs[0]);
    ok(mock.aborted > ab0, 'net: 시간 초과된 요청은 취소(abort)', 'aborted +' + (mock.aborted - ab0));
    ok(r.outs[1] === 'fail\tnil\ttrue', 'net: 네트워크 오류 → nil, "network error ..."', r.outs[1]);
    ok(r.outs[2] === '404\tnot found\t404', 'net: HTTP 상태 코드 전달 (404)', r.outs[2]);
    ok(r.outs[3] === 'post\ttrue\t4\tPOST\tapplication/x-test', 'net: http_post 바이너리 본문 + Content-Type', r.outs[3]);
  }
  // (d) WebSocket
  {
    const r = await runLua([
      'local ws, err = ws_open("ws://mock/ws")',
      'print("open", ws ~= nil, ws and ws:state(), err)',
      'ws:send("hello")',
      'print("recv", ws:recv(1))',
      'ws:send("bin")',
      'local b = ws:recv(1)',
      'local okb = #b == 256',
      'for i = 0, 255 do if b:byte(i + 1) ~= i then okb = false end end',
      'print("bin", #b, okb)',
      'ws:send(string.char(0, 200, 255), "binary")',
      'local e = ws:recv(1)',
      'print("binecho", #e, e:byte(1), e:byte(2), e:byte(3))',
      'ws:send("burst 5")',
      'local m1 = ws:recv(1)',
      'print("burst", m1, ws:available())',
      'local cnt = 0',
      'while ws:poll() do cnt = cnt + 1 end',
      'print("polled", cnt, ws:available())',
      'local t0 = sim_time()',
      'local m, why = ws:recv(0.02)',
      'printf("rto %s %s %.6f", tostring(m), tostring(why), sim_time() - t0)',
      'ws:send("bye")',
      'local m2, why2 = ws:recv(1)',
      'print("closed", m2, why2, ws:state())',
      'print("send_after_close", ws:send("x"))',
      'local s2, e2 = ws_open("ws://mock/refuse")',
      'print("refuse", s2, e2)',
      'local s3 = ws_open("ws://mock/ws", { wait = false })',
      'print("nowait", s3:state())',
      's3:send("queued")',
      'print("queued", s3:recv(1))'
    ].join('\n'), { cpi: 0 });
    const o = r.outs;
    ok(r.rt.state === 'done', 'ws: 스크립트 완료', r.rt.state + ' ' + JSON.stringify(r.rt.errorInfo));
    ok(o[0] === 'open\ttrue\topen\tnil', 'ws: ws_open 연결 대기', o[0]);
    ok(o[1] === 'recv\techo:hello', 'ws: send/recv (text)', o[1]);
    ok(o[2] === 'bin\t256\ttrue', 'ws: binary 메시지 0..255 무손실', o[2]);
    ok(o[3] === 'binecho\t3\t0\t200\t255', 'ws: binary 전송 (mode "binary")', o[3]);
    ok(o[4] === 'burst\tm0\t4' && o[5] === 'polled\t4\t0', 'ws: 수신 대기열 / available / poll', o[4] + ' | ' + o[5]);
    ok(o[6] === 'rto nil timeout 0.020000', 'ws: recv timeout = 시뮬레이션 시간', o[6]);
    ok(o[7] === 'closed\tnil\tclosed\tclosed', 'ws: 서버 종료 → recv nil, "closed"', o[7]);
    ok(/^send_after_close\tnil\tWebSocket is closed/.test(o[8]), 'ws: 닫힌 소켓 send → nil, 오류', o[8]);
    ok(/^refuse\tnil\tconnection failed/.test(o[9]), 'ws: 연결 실패 → nil, 오류', o[9]);
    ok(o[10] === 'nowait\tconnecting' && o[11] === 'queued\techo:queued', 'ws: wait=false + 연결 전 send 는 연결 후 전송', o[10] + ' | ' + o[11]);
  }
  // (e) coroutine 안에서 대기 불가 (명확한 오류), 비동기 확인은 가능
  {
    const r = await runLua([
      'local co = coroutine.wrap(function() return http_get("http://mock/bytes") end)',
      'local ok, err = pcall(co)',
      'print("co", ok, tostring(err):find("메인 스크립트", 1, true) ~= nil)',
      'local req = http_request("http://mock/bytes")',
      'print("co_ready", coroutine.wrap(function() return req:ready() end)())'
    ].join('\n'));
    ok(r.outs[0] === 'co\tfalse\ttrue' && r.outs[1] === 'co_ready\tfalse', 'net: coroutine 내부 대기 → 오류, ready() 확인은 허용', r.outs.join(' | '));
  }
  // (f) 스크립트 정지 → 요청 취소, 소켓 닫힘
  {
    const ab0 = mock.aborted, ns0 = mock.sockets.length;
    const r = await runLua('local ws = ws_open("ws://mock/ws")\nlocal r = http_request("http://mock/hang")\nprint("started")\nwhile true do delay(1) end',
      { until: (sim, outs) => outs.length > 0 });
    r.sim.stopScript(); r.sim._applyActions();
    const sock = mock.sockets[ns0];
    ok(r.outs[0] === 'started' && mock.aborted === ab0 + 1 && sock && sock.readyState >= 2 && r.rt.net.reqs.size === 0 && r.rt.net.socks.size === 0,
      'net: 스크립트 정지 시 요청 취소 + 소켓 닫기', 'aborted +' + (mock.aborted - ab0) + ', ws readyState ' + (sock && sock.readyState));
  }
  // (g) 예제 11 (HTTP 프레임 재생), 12 (WebSocket 스트림) — 모의 서버
  for (const name of ['11_net_http_frames.lua', '12_net_ws_stream.lua']) {
    const ex = VS.EXAMPLES.find(e => e.name === name), st = ex.setup;
    // DAC1 에 나타난 코드 = 표시된 프레임의 X 좌표 (k*100 + 1..4) — 타임라인은 최근 구간만 보존되므로 틱마다 누적
    const codes = new Set();
    const r = await runLua(ex.code, {
      cpi: st.cpi, max: 200,
      setup: (sim) => { sim.setProbe(0, st.probes[0]); sim.setProbe(1, st.probes[1]); sim.scope.setMode(st.mode); Object.assign(sim.scope.s.xy, st.xy); st.ch.forEach((c, i) => Object.assign(sim.scope.s.ch[i], c)); },
      until: (sim) => { for (const b of sim.inputs[0].tl.bps) codes.add(Math.round(b.raw.v / 3.3 * 4095)); return false; }
    });
    const frames = new Set(Array.from(codes).filter(c => c > 0 && c < 1000).map(c => Math.floor(c / 100)));
    const rec = r.sim.scope.xyRecord();
    ok(r.rt.state === 'running' && frames.size >= (name.startsWith('11') ? 6 : 3) && rec && rec.n > 1000,
      'example ' + name + ' (모의 서버)', 'frames ' + Array.from(frames).sort().join(',') + ', xy pts ' + (rec ? rec.n : 0) + ', sim ' + r.sim.simTime.toFixed(2) + ' s | ' + r.outs.slice(0, 2).join(' | '));
  }
}
})();
</script></body></html>
